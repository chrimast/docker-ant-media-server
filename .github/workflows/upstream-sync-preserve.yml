name: Upstream Sync (Preserve Fork Changes)

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge upstream without overwriting fork changes
        env:
          rez0n/docker-ant-media-server_REPO: rez0n/docker-ant-media-server
          rez0n/docker-ant-media-server_master: UPmaster
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${rez0n/docker-ant-media-server_REPO}.git" 2>/dev/null || true
          git fetch --no-tags upstream "${rez0n/docker-ant-media-server_master}"
          git merge --no-ff --no-edit "upstream/${rez0n/docker-ant-media-server_master}"
          git push origin HEAD:master
